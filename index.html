<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0Risco.IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c0f;color:#c8d6e8;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{text-align:center;padding:40px 20px;width:100%;max-width:520px}
.logo-img{height:80px;margin-bottom:16px;object-fit:contain}
.logo-txt{font-size:36px;font-weight:900;color:#ffd60a;margin-bottom:16px;display:none}
h1{font-size:30px;font-weight:900;color:#fff;margin-bottom:6px}
p{font-size:13px;color:#7a9ab5;margin-bottom:40px}
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 28px;border-radius:12px;
  text-decoration:none;font-weight:700;font-size:14px;transition:all .2s;min-width:150px;flex:1;max-width:160px}
.btn-admin{background:#ffd60a;color:#000}
.btn-admin:hover{background:#ffe033;transform:translateY(-3px);box-shadow:0 8px 24px rgba(255,214,10,.3)}
.btn-liberador{background:#1a2540;border:2px solid #2979ff;color:#6fa8ff}
.btn-liberador:hover{background:#1e2d50;border-color:#448aff;transform:translateY(-3px)}
.btn-campo{background:#1a1f28;border:1px solid #2e3748;color:#c8d6e8}
.btn-campo:hover{border-color:#ffd60a;color:#ffd60a;transform:translateY(-3px)}
.icon{font-size:32px}
.role-label{font-size:10px;opacity:.7;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
footer{margin-top:48px;font-size:11px;color:#4a6480}
</style>
</head>
<body>
<div class="box">
  <img class="logo-img" src="logo_0risco_ia_realistic_front.png" alt="0Risco.IA"
       onerror="this.style.display='none';document.querySelector('.logo-txt').style.display='block'">
  <div class="logo-txt">0Risco.IA</div>
  <p>Gestão de Permissões de Trabalho a Quente · NR-34 / NR-35</p>
  <div class="btns">
    <a href="admin.html" class="btn-admin">
      <span class="icon">📊</span>
      Painel Admin
      <span class="role-label">Administrador</span>
    </a>
    <a href="liberador.html" class="btn-liberador">
      <span class="icon">🔑</span>
      Portal Liberador
      <span class="role-label">Liberador / Aprovador</span>
    </a>
    <a href="0risco-mobile.html" class="btn-campo">
      <span class="icon">📱</span>
      App de Campo
      <span class="role-label">Avaliador / Executante</span>
    </a>
  </div>
  <footer>0Risco.IA v2.0 · NR-34 / NR-35 · Probabilidade × Gravidade</footer>
</div>
</body>
</html>
